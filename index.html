<title>Kết Nối Tài Trợ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: two areas under one top bar — "Khám phá" (search engine + project pages) and "Dự án của tôi" (team workspace with tabs, board and side drawer) */
:root{
  --bg:#F3F6F5; --surface:#FFFFFF; --surface-2:#EAF0EE; --ink:#14201C; --muted:#5A6A64; --line:#D7E0DC;
  --accent:#0D6A56; --accent-ink:#FFFFFF; --accent-soft:#D9EEE7; --gold:#B97C06; --gold-soft:#FBEFD2;
  --danger:#B42318; --danger-soft:#FDE4E1; --ok:#1E7B34; --ok-soft:#DDF3E2; --blue:#2F68C4; --blue-soft:#E0EAFA; --violet:#6A4BD1; --violet-soft:#ECE6FD;
  --shadow:0 10px 30px rgba(14,40,32,.12);
  --f-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#151D1A; --surface-2:#1C2622; --ink:#E4EDE9; --muted:#93A49D; --line:#283530;
  --accent:#4DC4A3; --accent-ink:#06231B; --accent-soft:#173A31; --gold:#E9B949; --gold-soft:#3A2E12;
  --danger:#F28B7F; --danger-soft:#3D1D19; --ok:#6BD48A; --ok-soft:#173622; --blue:#7FA8EE; --blue-soft:#1A2A45; --violet:#AE9BF5; --violet-soft:#2A2247;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#151D1A; --surface-2:#1C2622; --ink:#E4EDE9; --muted:#93A49D; --line:#283530;
  --accent:#4DC4A3; --accent-ink:#06231B; --accent-soft:#173A31; --gold:#E9B949; --gold-soft:#3A2E12;
  --danger:#F28B7F; --danger-soft:#3D1D19; --ok:#6BD48A; --ok-soft:#173622; --blue:#7FA8EE; --blue-soft:#1A2A45; --violet:#AE9BF5; --violet-soft:#2A2247;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14.5px;line-height:1.5}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1320px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.nav{display:flex;gap:2px;background:var(--surface-2);border-radius:10px;padding:3px}
.nav button{border:0;background:none;padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:500;color:var(--muted);white-space:nowrap}
.nav button[aria-current="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.nav .n{font-family:var(--f-mono);font-size:11px;background:var(--danger);color:#fff;border-radius:999px;padding:0 6px;margin-left:4px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.me{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.av{width:24px;height:24px;border-radius:50%;object-fit:cover;vertical-align:middle;flex:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--danger);border-color:var(--danger-soft)}
.btn.danger.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.ok{color:var(--ok);border-color:var(--ok-soft)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
select.sel,input.inp,textarea.inp{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;width:100%;min-width:0}
textarea.inp{resize:vertical;min-height:72px}
select.sel{width:auto;max-width:260px}

.wrap{max-width:1320px;margin:0 auto;padding-inline:16px;padding-block:18px 60px;display:flex;flex-direction:column;gap:16px}
.banner{border:1px solid var(--line);background:var(--gold-soft);border-radius:10px;padding:10px 14px;font-size:13.5px}

/* workspace head */
.phead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:end}
.phead h1{font-size:24px;font-weight:700;letter-spacing:-.01em}
.phead p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.stats{display:flex;gap:6px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-width:96px}
.stat b{display:block;font-size:20px;font-family:var(--f-mono);font-weight:500}
.stat.alert b{color:var(--danger)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .n{font-family:var(--f-mono);font-size:11.5px;background:var(--surface-2);border-radius:999px;padding:1px 7px;margin-left:4px}
.tab .n.hot{background:var(--danger);color:#fff}

/* panels & forms */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
.field>span{font-size:13px;font-weight:500}
.field small{color:var(--muted);font-size:12px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 11px;cursor:pointer;font-size:13px}
.checks input{accent-color:var(--accent)}
.checks label:has(input:checked){background:var(--accent-soft);border-color:var(--accent)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* onboarding */
.intro{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:18px;align-items:start}
.steps{display:flex;flex-direction:column;gap:12px}
.step{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px}
.step i{font-style:normal;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-mono);font-weight:500}
.step p{margin:2px 0 0;color:var(--muted);font-size:13.5px}

/* discover */
.hero{display:flex;flex-direction:column;gap:12px;padding-block:8px}
.hero h1{font-size:26px;letter-spacing:-.015em}
.hero p{margin:0;color:var(--muted)}
.sbox{display:flex;gap:8px;align-items:stretch;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 2px 10px rgba(14,40,32,.05)}
.sbox:focus-within{border-color:var(--accent)}
.sbox input{flex:1;min-width:0;border:0;background:transparent;padding:8px 10px;font-size:16px;outline:none}
.seg{display:flex;background:var(--surface-2);border-radius:9px;padding:3px;flex:none}
.seg button{border:0;background:none;border-radius:7px;padding:4px 10px;cursor:pointer;font-size:13px;color:var(--muted);font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters label.cb{display:inline-flex;gap:6px;align-items:center;font-size:13px}
.res-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:9px;cursor:pointer;min-width:0}
.pcard:hover{border-color:var(--muted)}
.pcard h3{font-size:16.5px}
.pcard p{margin:0;font-size:13.5px;color:var(--muted)}
.pcard .why{color:var(--ink);background:var(--gold-soft);border-radius:8px;padding:7px 10px;font-size:13px}
.rchips{display:flex;flex-wrap:wrap;gap:5px}
.rchip{font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--accent);color:var(--accent);background:var(--accent-soft)}
.rchip.full{border-color:var(--line);color:var(--muted);background:var(--surface-2)}
.pfoot{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-top:auto;padding-top:8px;border-top:1px solid var(--line)}
.fund{display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.fund .bar{height:7px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.fund .bar i{display:block;height:100%;background:var(--gold)}
mark{background:var(--gold-soft);color:inherit;border-radius:3px;padding:0 1px}

/* project page */
.detail{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.dhead h1{font-size:28px;letter-spacing:-.015em;margin-top:6px}
.dhead p{margin:6px 0 0;color:var(--muted);font-size:15.5px;max-width:65ch}
.prose h3{font-size:14px;margin-bottom:4px}
.prose p{margin:0;white-space:pre-wrap;max-width:68ch}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:13.5px}
.facts dt{color:var(--muted)}
.facts dd{margin:0}
.role{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.role.mine{border-color:var(--accent);background:var(--accent-soft)}
.role-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.role-h b{font-size:14px}
.role p{margin:0;font-size:13px;color:var(--muted)}
.status{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px}
.status.pending{background:var(--gold-soft);color:var(--gold)}
.status.accepted{background:var(--ok-soft);color:var(--ok)}
.status.declined,.status.removed{background:var(--danger-soft);color:var(--danger)}
.people{display:flex;flex-direction:column;gap:8px}
.person{display:flex;align-items:center;gap:8px;font-size:13.5px}
.app{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px}
.app p{margin:0;font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.rtable{display:grid;grid-template-columns:minmax(150px,1.2fr) 150px 90px minmax(0,2fr);gap:8px 10px;align-items:center;min-width:620px}
.rtable .h{font-size:12px;color:var(--muted);font-weight:500}
.scroll-x{overflow-x:auto}

/* find (sponsors) */
.findbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:end}
.progress{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px dashed var(--accent);border-radius:10px;background:var(--accent-soft)}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:pulse 1.2s infinite;flex:none}
@keyframes pulse{50%{opacity:.25}}
.cands{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.cand{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.cand h3{font-size:15.5px}
.cand .meta{font-size:12.5px;color:var(--muted)}
.cand p{margin:0;font-size:13.5px}
.cand dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 10px;font-size:12.5px}
.cand dt{color:var(--muted)}
.cand dd{margin:0}
.fit{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:12px}
.fit .bar{flex:1;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;max-width:120px}
.fit .bar i{display:block;height:100%;background:var(--gold)}
.conf{font-size:11px;padding:1px 7px;border-radius:999px}
.conf.high{background:var(--ok-soft);color:var(--ok)}
.conf.medium{background:var(--gold-soft);color:var(--gold)}
.conf.low{background:var(--danger-soft);color:var(--danger)}
.cand .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px;border-top:1px solid var(--line)}
.added{color:var(--ok);font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:4px}
.batch-h{display:flex;align-items:baseline;gap:10px;margin-top:6px;flex-wrap:wrap}

/* pipeline */
.todo{display:flex;flex-direction:column;gap:6px}
.todo-item{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line);cursor:pointer;text-align:left;width:100%}
.todo-item:hover{border-color:var(--muted)}
.tag{font-family:var(--f-mono);font-size:11px;padding:2px 7px;border-radius:5px;white-space:nowrap}
.tag.red{background:var(--danger-soft);color:var(--danger)}
.tag.gold{background:var(--gold-soft);color:var(--gold)}
.tag.grey{background:var(--surface-2);color:var(--muted)}
.board-wrap{overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
.board{display:grid;grid-template-columns:repeat(6,minmax(220px,1fr));gap:10px;min-width:1380px}
@media (min-width:1360px){.board{min-width:0}}
.col{background:var(--surface-2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:180px;scroll-snap-align:start}
.col.over{outline:2px dashed var(--accent);outline-offset:-2px}
.col-h{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13px;padding:2px 4px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.col-h .mono{margin-left:auto;color:var(--muted);font-weight:400}
.card{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 11px;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left;width:100%}
.card:hover{border-color:var(--muted)}
.card b{font-size:13.5px;font-weight:600;line-height:1.3}
.card .meta{font-size:12px;color:var(--muted)}
.card .foot{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card .foot .av{margin-left:auto;width:20px;height:20px}
.col-empty{font-size:12.5px;color:var(--muted);padding:8px 4px}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.addrow .inp{flex:1;min-width:200px;width:auto}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,20,16,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--bg);z-index:41;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dr-h{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.dr-h input{font-size:17px;font-weight:700;border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 6px;flex:1;min-width:0}
.dr-h input:hover,.dr-h input:focus{border-color:var(--line);background:var(--bg)}
.dr-b{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.sec h3{font-size:14px}
.log{display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto}
.log-i{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;font-size:13px}
.log-i .when{font-size:11.5px;color:var(--muted)}
.log-i p{margin:1px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.picker{position:relative}
.pick-menu{position:absolute;top:calc(100% + 4px);left:0;z-index:5;width:260px;max-width:80vw;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:8px;display:flex;flex-direction:column;gap:4px}
.pick-opt{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;border:0;background:none;cursor:pointer;text-align:left;width:100%}
.pick-opt:hover{background:var(--surface-2)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;font-size:13.5px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.empty{text-align:center;padding:30px 16px;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px}
.err{color:var(--danger);font-size:13.5px}

@media (max-width:860px){.detail{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .phead,.intro,.findbar{grid-template-columns:minmax(0,1fr)}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .phead h1,.hero h1{font-size:21px}
  .dhead h1{font-size:23px}
  .brand-name{display:none}
  select.sel{max-width:170px}
  .sbox{flex-wrap:wrap}
  .sbox input{flex-basis:100%}
  .results{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header class="top"><div class="top-in">
  <div class="brand"><span class="brand-mark" aria-hidden="true">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12h8M12 8v8"/><circle cx="5" cy="12" r="3"/><circle cx="19" cy="12" r="3"/></svg>
  </span><span class="brand-name">Kết Nối Tài Trợ</span></div>
  <nav id="nav" class="nav" aria-label="Khu vực"></nav>
  <div class="top-right"><div id="psel-wrap" class="row"></div><div id="me" class="me"></div></div>
</div></header>

<div class="wrap">
  <div id="banner"></div>
  <section id="phead"></section>
  <nav id="tabs" class="tabs" role="tablist"></nav>
  <div id="view"><div class="empty"><h3>Đang tải danh sách dự án…</h3><p>Các dự án đang tìm người tham gia và nhà tài trợ sẽ hiện ở đây.</p></div></div>
</div>
<div id="drawer-root"></div>
<div id="toast" class="toast" hidden></div>

<script>
/* ---------- constants ---------- */
const STAGES=[
  {k:'idea',l:'Đã lưu',c:'var(--muted)'},
  {k:'research',l:'Đang tìm hiểu',c:'var(--blue)'},
  {k:'contacted',l:'Đã liên hệ',c:'var(--gold)'},
  {k:'talking',l:'Đang trao đổi',c:'var(--violet)'},
  {k:'won',l:'Đồng ý tài trợ',c:'var(--ok)'},
  {k:'declined',l:'Từ chối',c:'var(--danger)'}];
const STAGE=Object.fromEntries(STAGES.map(s=>[s.k,s]));
const ROLES=[
  {k:'member',l:'Thành viên',d:'Tham gia nhóm thực hiện lâu dài và được vào không gian làm việc của dự án.',team:true},
  {k:'contributor',l:'Cộng tác viên',d:'Đóng góp theo đầu việc hoặc kỹ năng cụ thể, cũng được vào không gian làm việc.',team:true},

/* ---------- stores ---------- */
function dbErr(e){console.warn('db',e);if(e?.code==='revoked'){S.canWrite=false;renderBanner()}}
function dbStore(db){
  const chains={};
  const q=(k,fn)=>{const p=(chains[k]||Promise.resolve()).catch(()=>{}).then(fn);chains[k]=p;return p};
  const list=s=>s.docs.filter(d=>d.exists).map(d=>({id:d.id,...d.data()}));
  return{
    watch:(c,cb)=>db.collection(c).onSnapshot(s=>cb(list(s)),dbErr),
    watchDoc:(c,id,cb)=>db.doc(c+'/'+id).onSnapshot(d=>cb(d.exists?d.data():null),dbErr),
    list:async c=>list(await db.collection(c).get()),
    set:(c,id,v)=>q(c+'/'+id,()=>db.doc(c+'/'+id).set(v)),
    update:(c,id,v)=>q(c+'/'+id,()=>db.doc(c+'/'+id).update(v)),
    del:(c,id)=>q(c+'/'+id,()=>db.doc(c+'/'+id).delete()),
  };
}
function localStore(){
  const KEY='ktt-local-v2';let data={};
  try{const r=localStorage.getItem(KEY);if(r)data=JSON.parse(r)}catch(e){}
  const subs=new Set();
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}subs.forEach(f=>f())};
  const on=fn=>{subs.add(fn);setTimeout(fn,0);return()=>subs.delete(fn)};
  const ent=c=>Object.entries(data[c]||{}).map(([id,v])=>({id,...v}));
  return{
    watch:(c,cb)=>on(()=>cb(ent(c))),
    watchDoc:(c,id,cb)=>on(()=>cb(data[c]?.[id]||null)),
    list:async c=>ent(c),
    async set(c,id,v){(data[c]||(data[c]={}))[id]=clone(v);save()},
    async update(c,id,v){const m=data[c]||(data[c]={});m[id]={...m[id],...clone(v)};save()},
    async del(c,id){if(data[c])delete data[c][id];save()},
  };
}

    else if(c==='quota_exceeded')toast('Kho dữ liệu đã đầy. Hãy xoá bớt dữ liệu cũ.');
    else if(c==='resource_exhausted')toast('Thao tác quá nhanh, chờ vài giây rồi thử lại.');
    else toast('Không lưu được. Kiểm tra kết nối và thử lại.');
    console.warn(e);return false}
}

async function boot(){
  const C=window.claude;
  let db=null,user=null,sample=null;
  if(C?.use){[db,user,sample]=await Promise.all([C.use('db'),C.use('user'),C.use('sample')])}
  S.user=user;S.sample=sample;
  if(user){S.me=await user.me();S.isOwner=S.me.isOwner;const w=await user.can('data.write');if(w===false)S.canWrite=false}
  S.store=db?dbStore(db):localStore();S.mode=db?'db':'local';
  const h=(location.hash||'').match(/^#p-([A-Za-z0-9_-]+)$/);if(h){S.area='discover';S.detail=h[1]}
  renderMe();renderBanner();renderNav();
  S.store.watch('projects',list=>{S.projects=list.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));S.loaded=true;refresh('projects')});
  S.store.watch('applications',list=>{S.apps=Object.fromEntries(list.map(d=>[d.id,d]));refresh('apps')});
  S.store.watch('decisions',list=>{S.decisions=Object.fromEntries(list.map(d=>[d.id,d]));refresh('apps')});
}
function syncWorkspace(){
  const mine=myProjects();
  if(!mine.find(p=>p.id===S.pid)){const f=mine[0];S.pid=f?f.id:null}
  if(S.subPid!==S.pid){subscribeProject(S.pid);return true}
  return false;
}
function refresh(kind){

  const switched=syncWorkspace();
  renderNav();

    if(S.detail){if(!S.joinDirty)renderDetail()}
    else if($('#dres'))renderResults();else renderView();
    return;
  }

  if(switched||!curProject()&&!S.creating){renderView();return}
  if(S.tab==='brief'&&!S.briefDirty&&!S.creating)renderView();
  if(S.tab==='people'&&!S.peopleDirty)renderView();
}
function subscribeProject(pid){
  S.unsubs.forEach(f=>{try{f()}catch(e){}});S.unsubs=[];
  S.pid=pid;S.subPid=pid;S.sponsors=[];S.sugg=null;S.findErr='';S.briefDirty=false;S.peopleDirty=false;closeDrawer();
  if(pid)lsSet('ktt-pid',pid);
  if(pid){
    S.unsubs.push(S.store.watch(SP(pid),list=>{
      S.sponsors=list.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
      if(S.area!=='workspace')return;
      renderHead();renderTabs();if(S.tab==='pipeline')renderView();if(S.tab==='find'&&!S.finding)renderView();maybeRenderDrawer();
    }));

  }
}

function go(area,opts={}){
  S.area=area;lsSet('ktt-area',area);closeDrawer();

const listed=()=>S.projects.filter(p=>openCfg(p).listed||isTeam(p));
function openRoles(p){
  const cfg=openCfg(p);const acc=accepted(p);
  return cfg.roles.filter(r=>r.on).map(r=>{const n=acc.filter(m=>m.role===r.k).length;return{...r,count:n,full:r.slots>0&&n>=r.slots}});
}
function passFilters(p){
  if(S.fCat&&p.category!==S.fCat)return false;
  const roles=openRoles(p);
  if(S.fRole&&!roles.find(r=>r.k===S.fRole&&!r.full))return false;
  if(S.fOpen&&!roles.some(r=>!r.full))return false;
  return true;
}
function kwSearch(q){
  const toks=norm(q).split(/[\s,.;:/]+/).filter(t=>t.length>1);
  const all=listed().filter(passFilters);
  if(!toks.length)return all.map(p=>({p,score:0,hit:0}));
  const out=[];
  for(const p of all){
    const cfg=openCfg(p);
    const F=[[p.name,6],[p.oneLiner,3],[p.category,3],[cfg.skills.join(' '),3],[openRoles(p).map(r=>r.l).join(' '),2],[p.location,2],[p.orgType,1],[p.desc,1],[p.beneficiaries,1],[p.achievements,1],[cfg.message,1]].map(([t,w])=>[norm(t),w]);
    let score=0,hit=0;
    for(const t of toks){let best=0;for(const [txt,w] of F)if(txt.includes(t))best=Math.max(best,w);if(best){hit++;score+=best}}
    if(norm(p.name).includes(norm(q).trim()))score+=10;
    if(hit)out.push({p,score,hit});
  }
  return out.sort((a,b)=>b.hit-a.hit||b.score-a.score).map(x=>({...x,partial:x.hit<toks.length}));
}
function hl(text,q){
  const s=esc(text);if(!q||S.qMode!=='kw')return s;
  const toks=norm(q).split(/[\s,.;:/]+/).filter(t=>t.length>1);if(!toks.length)return s;
  // highlight on the escaped original by matching normalized positions per word
  return s.split(/(\s+)/).map(w=>toks.some(t=>norm(w).includes(t))?`<mark>${w}</mark>`:w).join('');
}

function readBrief(){

    beneficiaries:g('b-benef'),budget:g('b-budget'),timeline:g('b-timeline'),achievements:g('b-achv'),
    needs:[...document.querySelectorAll('input[name=need]:checked')].map(i=>i.value)};
}
async function submitBrief(e){
  e.preventDefault();const data=readBrief();
  if(!data.name){toast('Hãy đặt tên cho dự án.');$('#b-name').focus();return}
  if(S.creating||!curProject()){
    if(!needId())return;
    const id=uid();const now=Date.now();
    const doc={...data,createdAt:now,createdBy:S.mode==='local'?null:myId(),open:{listed:true}};
    if(!await W(S.store.set('projects',id,doc)))return;
    S.creating=false;S.draftProject=null;S.briefDirty=false;S.tab='people';lsSet('ktt-tab','people');
    if(!S.projects.find(p=>p.id===id))S.projects.unshift({id,...doc});
    selectProject(id);toast('Đã tạo và đăng dự án lên Khám phá. Chọn các vai trò bạn cần tuyển.');
  }else{
    if(await W(S.store.update('projects',S.pid,{...data,updatedAt:Date.now()}))){S.briefDirty=false;toast('Đã lưu hồ sơ dự án.')}
  }
}

function briefText(p){
  return [`Project name: ${p.name}`,p.oneLiner&&`One-liner: ${p.oneLiner}`,p.desc&&`Description: ${p.desc}`,p.category&&`Field: ${p.category}`,
    p.orgType&&`Team type: ${p.orgType}`,p.location&&`Location: ${p.location}`,p.beneficiaries&&`Beneficiaries: ${p.beneficiaries}`,
    p.budget&&`Budget needed: ${p.budget}`,p.timeline&&`Timeline: ${p.timeline}`,p.achievements&&`Track record: ${p.achievements}`,
    p.needs?.length&&`Support needed: ${p.needs.join(', ')}`].filter(Boolean).join('\n');
}
function findPrompt(p,extra,exclude){
  return `You are an experienced international fundraising researcher. A Vietnamese team (students or a small nonprofit/community group) needs INTERNATIONAL sponsors, grant-makers and partner organizations for the project below.

PROJECT BRIEF (written by the team, may be in Vietnamese):
${briefText(p)}
${extra?`\nEXTRA INSTRUCTIONS FROM THE TEAM:\n${extra}\n`:''}
${exclude.length?`\nALREADY ON THEIR LIST - do not suggest these again:\n${exclude.slice(0,80).join('; ')}\n`:''}
Suggest exactly 8 organizations or funding programs that are a realistic fit. Rules:
- Only real organizations/programs you are confident exist. Never invent names, programs or amounts.
- Prefer ones that actually fund or partner with youth, student or grassroots/community projects in Vietnam, Southeast Asia, or that are open globally.
- Mix types where sensible: private/family foundations, corporate CSR or employee-giving programs of multinationals active in Vietnam, embassy or government small-grants funds, UN/multilateral agencies, international NGOs, youth competitions/prizes/fellowships, and in-kind or mentorship partners.
- Be realistic about scale: match typical grant size to the project's budget.
- "website": official homepage URL only if you are sure of it, otherwise "".
- "typicalAmount": typical grant size if you know it (e.g. "1,000-5,000 USD"), else "".
- "cycle": when/how often they accept applications if known, else "".
- "confidence": "high" if you are confident it is active and open to this kind of applicant, "medium" if likely, "low" if uncertain or possibly discontinued.
- "fit" and "approach" must be written in Vietnamese. "approach" = concrete first step (e.g. which program to apply to, who to email, what to prepare).

Reply with ONLY a JSON array of 8 objects with these keys:
{"name": string, "type": one of ["Quỹ tư nhân","CSR doanh nghiệp","Đại sứ quán / chính phủ","Tổ chức LHQ / đa phương","NGO quốc tế","Cuộc thi / giải thưởng","Đối tác hiện vật / cố vấn"], "country": string (HQ country, in Vietnamese), "focus": string (their funding focus, Vietnamese, under 15 words), "fit": string (why this project fits, 1-2 sentences), "approach": string (1-2 sentences), "typicalAmount": string, "cycle": string, "website": string, "fitScore": integer 1-100, "confidence": "high"|"medium"|"low"}`;
}
function normCand(x){
  return{id:uid(),name:String(x.name||'').slice(0,160),type:String(x.type||''),country:String(x.country||''),focus:String(x.focus||''),
    fit:String(x.fit||''),approach:String(x.approach||''),typicalAmount:String(x.typicalAmount||''),cycle:String(x.cycle||''),
    website:safeUrl(x.website),fitScore:Math.max(0,Math.min(100,Math.round(Number(x.fitScore)||0))),
    confidence:['high','medium','low'].includes(x.confidence)?x.confidence:'medium'};
}
function sampleErr(e){
  return({not_granted:'Bạn chưa cho phép trang này dùng Claude. Mở menu quyền của artifact để bật lại.',
    sampling_disabled:'Tài khoản hoặc tổ chức của bạn chưa bật Claude cho trang này.',
    rate_limited:'Bạn đã dùng nhiều lượt trong thời gian ngắn hoặc chạm giới hạn sử dụng. Thử lại sau ít phút.',
    session_expired:'Phiên đăng nhập đã hết hạn. Hãy đăng nhập lại Claude.',
    invalid_json:'AI trả về kết quả không đúng định dạng. Bấm tìm lại.',
    refused:'Claude không xử lý được yêu cầu này. Thử viết lại yêu cầu.',

async function findSponsors(){
  if(!S.sample||S.finding)return;
  const p=curProject();if(!p)return;
  const extra=($('#f-extra')?.value||'').trim(),deep=$('#f-deep')?.checked;
  const exclude=[...new Set([...S.sponsors.map(s=>s.name),...(S.sugg?.items||[]).map(s=>s.name)])];
  const ctl=new AbortController();S.finding={ctl,count:0,extra,deep};S.findErr='';renderFind();
  try{
    const res=await S.sample.json(findPrompt(p,extra,exclude),{signal:ctl.signal,cache:false,modelTier:deep?'complex':'default',
      onText:({text})=>{const n=(text.match(/"name"\s*:/g)||[]).length;if(S.finding&&n!==S.finding.count){S.finding.count=n;const el=$('#f-count');if(el)el.textContent=`Đã tìm được ${Math.min(n,8)}/8 gợi ý…`}}});
    const arr=(Array.isArray(res)?res:(res?.items||res?.sponsors||[])).filter(x=>x&&x.name).map(normCand);
    if(!arr.length)throw{code:'invalid_json'};
    const batch=Date.now();arr.forEach(a=>a.batch=batch);
    const next={items:[...arr,...(S.sugg?.items||[])].slice(0,48),at:batch,by:myId(),batches:{...(S.sugg?.batches||{}),[batch]:{q:extra,by:myId()}}};
    S.sugg=next;
    await W(S.store.set(MP(p.id),'suggestions',next));
    toast(`Có ${arr.length} gợi ý mới.`);
  }catch(e){if(e?.code!=='cancelled')S.findErr=sampleErr(e)}
  finally{S.finding=null;if(S.area==='workspace'&&S.tab==='find')renderFind()}
}

function draftPrompt(p,s,kind,lang){
  const kinds={intro:'a short first-contact email introducing the team and project and asking whether the project fits their funding priorities and who to talk to (under 220 words, with a Subject line)',
    proposal:'a one-page sponsorship/grant proposal letter: problem, solution, activities, measurable outcomes, budget request and how funds are used, why this sponsor, what recognition/reporting the sponsor gets (under 450 words, with a Subject line)',
    follow:'a polite follow-up email after no reply to an earlier message, adding one new concrete detail about the project (under 150 words, with a Subject line)',
    thanks:'a thank-you letter for agreeing to support the project, confirming next steps and how the team will report results (under 200 words, with a Subject line)'};
  return `Write ${kinds[kind]} in ${lang==='Vietnamese'?'Vietnamese':'English'}.

SENDER: a Vietnamese ${p.orgType||'youth/community team'}.
PROJECT BRIEF:
${briefText(p)}

RECIPIENT ORGANIZATION: ${s.name}${s.type?` (${s.type})`:''}${s.country?`, ${s.country}`:''}
${s.contactName?`Contact person: ${s.contactName}\n`:''}${s.focus?`Their focus: ${s.focus}\n`:''}${s.fit?`Why the project fits them: ${s.fit}\n`:''}${s.approach?`Suggested approach: ${s.approach}\n`:''}${s.amountAsked?`Support to request: ${s.amountAsked}\n`:''}
Rules: specific and warm but professional; connect the project to the recipient's own priorities; never invent statistics, partners or achievements not in the brief; put anything the team must fill in inside [square brackets] (for example [Họ tên người gửi], [số điện thoại]); plain text, no markdown.`;
}

const armed=new WeakSet();
function arm(btn,label,fn){
  if(armed.has(btn)){fn();return}
  armed.add(btn);const old=btn.textContent;btn.classList.add('armed');btn.textContent=label;
  setTimeout(()=>{if(btn.isConnected){armed.delete(btn);btn.classList.remove('armed');btn.textContent=old}},4000);
}
const ACT={
  area:a=>go(a.dataset.area),
  detail:a=>go('discover',{pid:a.dataset.pid}),
  back:()=>go('discover'),
  'to-workspace':a=>go('workspace',{pid:a.dataset.pid,tab:a.dataset.tab}),
  qmode:a=>{S.qMode=a.dataset.m;S.q=$('#dq')?.value||S.q;renderDiscover();$('#dq')?.focus()},
  'stop-ai':()=>S.ai?.ctl?.abort(),
  'join-open':a=>{if(!needId())return;S.joinRole=a.dataset.role;S.joinDirty=false;renderDetail().then(()=>$('#j-msg')?.focus())},
  'join-cancel':()=>{S.joinRole=null;S.joinDirty=false;renderDetail()},
  'demo-decide':async a=>{const p=S.projects.find(x=>x.id===S.detail),me=myId();if(!p?.demo||!me)return;const m=membership(p,me);if(!m)return;
    if(await W(S.store.set('decisions',p.id+'__'+me,{pid:p.id,userId:me,role:m.role,status:a.dataset.s,by:me,at:Date.now(),simulated:true})))toast(a.dataset.s==='accepted'?'Đã giả lập: bạn được nhận vào dự án.':'Đã giả lập: đơn bị từ chối.')},
  withdraw:a=>arm(a,'Bấm lần nữa để xác nhận',()=>withdraw(a.dataset.pid)),
  decide:a=>{const fn=()=>decide(a.dataset.uid,a.dataset.s);a.dataset.s==='removed'?arm(a,'Bấm lần nữa để xác nhận',fn):fn()},
  tab:a=>{S.tab=a.dataset.tab;lsSet('ktt-tab',S.tab);S.briefDirty=false;S.peopleDirty=false;renderView()},
  'new-project':()=>{S.creating=true;S.draftProject=null;closeDrawer();renderTop();renderHead();renderView()},
  'cancel-create':()=>{S.creating=false;renderTop();renderHead();renderView()},
  'fill-sample':()=>{S.draftProject={...SAMPLE_PROJECT};renderBrief(true);S.briefDirty=true;toast('Đã điền dự án mẫu. Sửa lại theo dự án của bạn trước khi tạo.')},
  'del-project':a=>arm(a,'Bấm lần nữa để xoá vĩnh viễn',async()=>{const id=S.pid;
    const ok=await W((async()=>{for(const d of await S.store.list(SP(id)))await S.store.del(SP(id),d.id);await S.store.del(MP(id),'suggestions');await S.store.del('projects',id)})());
    if(ok){S.projects=S.projects.filter(p=>p.id!==id);S.tab='find';S.subPid=undefined;syncWorkspace();renderTop();renderHead();renderView();toast('Đã xoá dự án.')}}),
  find:()=>findSponsors(),
  'stop-find':()=>S.finding?.ctl.abort(),
  'add-cand':a=>addCandidate(a.dataset.id),
  'dismiss-cand':a=>dismissCandidate(a.dataset.id),
  open:a=>openDrawer(a.dataset.sid),
  close:()=>{if(S.drawerDirty&&S.canWrite){toast('Bạn có thay đổi chưa lưu. Bấm “Lưu thay đổi”, hoặc đóng lần nữa để bỏ.');S.drawerDirty=false;return}closeDrawer()},
  'save-sponsor':()=>saveSponsor(),
  'add-note':()=>addNote(),
  draft:()=>draftLetter(),
  'stop-draft':()=>S.drafting?.ctl.abort(),
  'save-draft':async()=>{const s=sp(S.openSid);if(!s)return;if(await W(S.store.update(SP(S.pid),s.id,{draft:$('#d-draft').value,draftKind:$('#d-kind').value,updatedAt:Date.now(),updatedBy:myId()}))){S.drawerDirty=false;toast('Đã lưu bản nháp.')}},
  'copy-draft':()=>{const ta=$('#d-draft');const txt=ta.value;if(!txt)return;
    try{navigator.clipboard.writeText(txt).then(()=>toast('Đã sao chép.'),()=>{ta.select();toast('Nhấn Ctrl+C để sao chép.')})}catch(e){ta.select();toast('Nhấn Ctrl+C để sao chép.')}},
  'del-sponsor':a=>arm(a,'Bấm lần nữa để xoá',async()=>{const id=S.openSid;closeDrawer();if(await W(S.store.del(SP(S.pid),id)))toast('Đã xoá.')}),
  'pick-open':()=>{const m=$('#pick-menu');m.hidden=!m.hidden;if(!m.hidden){$('#pick-q').focus();searchPeople('')}},
  pick:a=>{$('#pick-menu').hidden=true;assign(a.dataset.uid||null)},
};
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');
  if(!e.target.closest('.picker')){const m=$('#pick-menu');if(m)m.hidden=true}
  if(!a||a.disabled)return;
  if(e.target.closest('a[href]'))return;
  e.preventDefault();e.stopPropagation();ACT[a.dataset.act]?.(a,e);
});
document.addEventListener('change',e=>{if(e.target.id==='psel')selectProject(e.target.value)});
document.addEventListener('submit',e=>{if(e.target.id==='brief')submitBrief(e)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.openSid){const m=$('#pick-menu');if(m&&!m.hidden){m.hidden=true;return}ACT.close()}});
document.addEventListener('dragstart',e=>{const c=e.target.closest?.('.card');if(c){e.dataTransfer.setData('text/plain',c.dataset.sid);e.dataTransfer.effectAllowed='move'}});
document.addEventListener('dragover',e=>{const col=e.target.closest?.('.col');if(col&&S.canWrite){e.preventDefault();document.querySelectorAll('.col.over').forEach(c=>c!==col&&c.classList.remove('over'));col.classList.add('over')}});
document.addEventListener('dragleave',e=>{const col=e.target.closest?.('.col');if(col&&!col.contains(e.relatedTarget))col.classList.remove('over')});
document.addEventListener('drop',e=>{const col=e.target.closest?.('.col');if(!col)return;e.preventDefault();col.classList.remove('over');const sid=e.dataTransfer.getData('text/plain');if(sid)changeStage(sid,col.dataset.stage)});

renderNav();renderTabs();
boot();
</script>
